id: reset
kind: node
provides: [episode_reset]
requires: []
inputs:
  # RST-2 behavioral inputs: realistic sensing + the streaming clock;
  # unused (and unwired) in teleport-only graphs
  bridge_info: {schema: json_utf8, rate_hz: 1}
  rgb_overhead: {schema: rgb8_image, rate_hz: 30}
  depth_overhead: {schema: depth_f32, rate_hz: 15}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  reset: {schema: reset_request_u32, rate_hz: 1}
  # the bridge's completion, forwarded back to the requester (RST-1)
  reset_done: {schema: reset_done_u32, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  # RST-2 motion: through the budget guard like every motion source (VAL-5)
  reset_joint_cmd: {schema: jointvec_f32, latency_class: soft_rt}
  reset_gripper_cmd: {schema: scalar_f32, latency_class: soft_rt}
  # teleport passthrough to the bridge, which owns state injection (BRG-4)
  bridge_reset: {schema: reset_request_u32, latency_class: best_effort}
  reset_done: {schema: reset_done_u32, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  arm: [franka, so101]
  gripper: any
safety_class: decision
eval: null
origin: hub
source: src/aisle/reset/service.py
