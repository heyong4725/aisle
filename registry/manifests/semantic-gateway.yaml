# SPEC 480 (issue #352): the semantic authorization boundary in a live
# graph. Every executor command is a proposal; the gateway derives the
# SEM-5 stage, asks the trusted authorizer for a single-use permit and
# forwards only permitted commands into budget-guard (which stays
# identical in every arm, SEM-8). Identity adapter selected by
# AISLE_SHIELD_ARM: oracle_sim_shield (ground-truth `poses`, rung L0
# ceiling), sensor_shield (reserved, fails closed), no_shield (control).
id: semantic-gateway
kind: node
provides: [semantic_authorization]
requires: [trajectory_generation]
inputs:
  # proposals from the executor (VAL-5 reserves joint_cmd/gripper_cmd input
  # ports for guard-gated actuators; the gateway is upstream of the guard)
  joint_proposal: {schema: jointvec_f32, rate_hz: 100}
  gripper_proposal: {schema: scalar_f32, rate_hz: 100}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  poses: {schema: posearray7d_f32, rate_hz: 15}
  # sensor_shield arm: rendered perception instead of ground truth
  rgb_overhead: {schema: rgb8_image, rate_hz: 15}
  bridge_info: {schema: json_utf8, rate_hz: 1}
  episode_goal: {schema: json_utf8, rate_hz: 1}
  episode_result: {schema: json_utf8, rate_hz: 1}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  joint_cmd: {schema: jointvec_f32, latency_class: soft_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: soft_rt}
  shield_event: {schema: json_utf8, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  arm: [franka, so101]
  gripper: parallel
safety_class: motion
eval:
  suite: tests/graph/test_semantic_gateway_graph.py (oracle arm, seeds 0..7)
  pass_rate: 1.0
  last_run: '2026-09-06'
origin: agent-authored
source: src/aisle/nodes/semantic_gateway.py
