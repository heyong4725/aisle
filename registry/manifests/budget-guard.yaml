id: budget-guard
kind: node
provides: [budget_guard]
requires: []
inputs:
  # RST-2: the behavioral reset's motion rides the same clamp path
  reset_joint_cmd: {schema: jointvec_f32, rate_hz: 100}
  reset_gripper_cmd: {schema: scalar_f32, rate_hz: 30}
  joint_cmd: {schema: jointvec_f32, rate_hz: 100}
  gripper_cmd: {schema: scalar_f32, rate_hz: 30}
  # SPEC 210 MOB-3 (mobile only): diff-drive command [v, omega] to guard
  base_cmd: {schema: base_cmd2d_f32, rate_hz: 50}
  # SPEC 210 MOB-3 (mobile only): base_pose feedback for the shelf keep-out
  # AND the stale-command watchdog's clock (ADR-29): a stale/timed-out base
  # is stopped within base_staleness_s of SIM time, checked per pose
  base_pose: {schema: base_pose3d_f32, rate_hz: 50}
  # the authoritative episode boundary: restarts the wall timer and
  # re-references velocity/hold state to home (ADR-9)
  reset_done: {schema: reset_done_u32, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
  # BG-5 stats cadence AND the ADR-29 fail-closed wall-net watchdog sweep
  # (mobile: required, and must be a dora timer <= 5000 ms —
  # MOBILE_GUARD_INCOMPLETE); wire from dora/timer/millis/5000 (payload opaque)
  tick: {schema: timer_tick, rate_hz: 0.2}
outputs:
  joint_cmd_safe: {schema: jointvec_f32, latency_class: hard_rt}
  gripper_cmd_safe: {schema: scalar_f32, latency_class: hard_rt}
  # SPEC 210 MOB-3 (mobile only): the clamped base command
  base_cmd_safe: {schema: base_cmd2d_f32, latency_class: hard_rt}
  violation: {schema: json_utf8, latency_class: best_effort}
  guard_stats: {schema: json_utf8, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  # Both fixed-base arms have official limits/FK in env/limits.toml and the
  # guard; mobile resolves to its Franka arm under MOB-4.
  arm: [franka, so101]
  gripper: any
safety_class: motion
eval:
  suite: tests/graph/test_guard_in_graph.py (SPEC 080 adversarial)
  pass_rate: 1.0
  last_run: '2026-08-03'
origin: hub
source: src/aisle/nodes/budget_guard.py
