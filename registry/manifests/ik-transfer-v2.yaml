id: ik-transfer-v2
kind: node
provides:
- trajectory_generation
requires:
- grasp_planning
inputs:
  grasp_pose:
    schema: pose7d_f32
    rate_hz: 30
  read_move:
    schema: json_utf8
    rate_hz: 1
  joint_state:
    schema: jointvec_f32
    rate_hz: 100
  reset_done:
    schema: reset_done_u32
    rate_hz: 1
  turn:
    schema: sim_turn_u64
    rate_hz: 100
    is_clock: true
outputs:
  joint_cmd:
    schema: jointvec_f32
    latency_class: soft_rt
  gripper_cmd:
    schema: scalar_f32
    latency_class: soft_rt
  move_done:
    schema: json_utf8
    latency_class: best_effort
  plan_done:
    schema: json_utf8
    latency_class: best_effort
  turn_done:
    schema: sim_turn_u64
    latency_class: hard_rt
params:
  max_joint_vel_rad_s:
    type: float
    default: 1.0
    range:
    - 0.1
    - 2.0
embodiment:
  arm:
  - franka
  - so101
  gripper: parallel
safety_class: motion
eval:
  suite: t1-l1-routed-transfer
  pass_rate: 1.0
  last_run: '2026-08-16'
origin: agent-authored
source: skills/ik-transfer-v2/ik_transfer_v2.py
