id: t2-scan-tsm
kind: node
provides:
- task_sequencing
requires:
- episode_verification
- label_text
- scan_candidates
inputs:
  episode_goal:
    schema: json_utf8
    rate_hz: 1
  episode_result:
    schema: json_utf8
    rate_hz: 1
  violation:
    schema: json_utf8
    rate_hz: 1
    turn_edge: episodic
  tick:
    schema: timer_tick
    rate_hz: 1
  target_pose:
    schema: pose7d_f32
    rate_hz: 1
    turn_edge: episodic
  move_done:
    schema: json_utf8
    rate_hz: 1
    turn_edge: episodic
  read_result:
    schema: json_utf8
    rate_hz: 1
    turn_edge: episodic
  plan_done:
    schema: json_utf8
    rate_hz: 1
    turn_edge: episodic
  turn:
    schema: sim_turn_u64
    rate_hz: 100
    is_clock: true
outputs:
  target_request:
    schema: json_utf8
    latency_class: best_effort
  episode_feedback:
    schema: json_utf8
    latency_class: best_effort
  read_move:
    schema: json_utf8
    latency_class: best_effort
  read_request:
    schema: json_utf8
    latency_class: best_effort
  grasp_target:
    schema: pose7d_f32
    latency_class: best_effort
  turn_done:
    schema: sim_turn_u64
    latency_class: hard_rt
params:
  max_retries:
    type: int
    default: 8
    range:
    - 0
    - 8
embodiment:
  arm:
  - franka
  gripper: any
safety_class: decision
eval:
  suite: t2-stack-registration
  pass_rate: 0.5
  last_run: '2026-08-24'

origin: agent-authored
source: skills/t2-scan-tsm/t2_scan_tsm.py
trust_tier: sandbox
