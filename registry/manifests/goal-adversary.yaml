# SPEC 480 (issue #352): graph-attested wrong-object adversary that rewrites
# the episode goal the policy sees; the verifier and the semantic gateway
# keep the true goal. Evaluation graphs only (graphs/shield_*).
id: goal-adversary
kind: node
provides: [goal_adversary]
requires: []
inputs:
  episode_goal: {schema: json_utf8, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  episode_goal: {schema: json_utf8, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  arm: [franka, so101]
  gripper: any
safety_class: decision
eval:
  suite: tests/graph/test_semantic_gateway_graph.py (adversary graphs, seed 3)
  pass_rate: 1.0
  last_run: '2026-09-06'
origin: agent-authored
source: src/aisle/nodes/goal_adversary.py
