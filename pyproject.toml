[project]
name = "aisle"
version = "0.1.0"
description = "AISLE: agentic auto-research for robot manipulation on open infrastructure"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.4.6",
    "pyarrow>=17.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
harness = "aisle.harness.cli:main"

# CON-1: linux resolves torch from the CPU index by default so the sim
# extra never drags CUDA/NVIDIA wheels; the `cuda` extra is the sanctioned
# home for GPU builds and is the ONLY way a CUDA wheel enters the closure
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# sim and cuda are mutually exclusive resolutions of torch: `--extra sim`
# is the CPU default, `--extra cuda` swaps in the GPU build
[tool.uv]
conflicts = [[{ extra = "sim" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", extra = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", extra = "sim", marker = "sys_platform == 'linux'" },
]
# dora main, pinned by rev (PyPI's latest wheel is 0.5.0, 2026-03 — too old;
# the CLI is cargo-installed from the SAME rev so the pair stays matched).
# cd597e70 (2026-08-04) contains the fixes for our filed issue batch
# (dora-rs/dora#2916-2924): the remove->add swap race (eec31a40b), node
# leaks on killed `dora run` (#2949/#3018), venv symlink resolution
# (#2942), and `dora run --exit-when-nodes-finish` (#2957).
dora-rs = { git = "https://github.com/dora-rs/dora", subdirectory = "apis/python/node", rev = "cd597e7059295cbe9af0d6082697361d152bd444" }

[project.optional-dependencies]
sim = [
    "dora-rs>=0.5.0",
    "genesis-world>=1.2.3",
    "pyarrow>=25.0.0",
    "torch>=2.13.0",
]
# GPU build: same sim stack, torch resolved from the CUDA index (CON-1).
# `uv sync --extra cuda` replaces `uv sync --extra sim`.
cuda = [
    "dora-rs>=0.5.0",
    "genesis-world>=1.2.3",
    "pyarrow>=25.0.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: no sim, no dora, <1 s each (CON-12)",
    "sim: imports genesis; headless (CON-12)",
    "graph: launches a dora dataflow (CON-12)",
    "accept: spec-acceptance; cites requirement IDs (CON-12)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
