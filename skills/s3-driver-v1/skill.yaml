# Campaign H3 (S3): agent-authored S3 re-shelving driver. Executes the
# swap goal as a 3-move cycle buffered on the counter (penalty-free in
# S3), reusing the proven S1 top-down pick and the S2-proven re-park
# shelf place, with the wrist spin at placement derived from the
# MEASURED in-hand yaw offset (poses topic vs FK) so the box lands at
# the slot yaw — the lost s2-driver-v1's dominant `misaligned` failure.
# L0-involving swaps are refused at plan time (safe no-op). Idea I1 in
# the H3-S3 campaign tree.
id: s3-driver-v1
kind: node
provides: [s3_reshelving_driving]
requires: [waypoint_navigation]
inputs:
  episode_goal: {schema: json_utf8, rate_hz: 1}
  nav_result: {schema: json_utf8, rate_hz: 1}
  base_pose: {schema: base_pose3d_f32, rate_hz: 50}
  poses: {schema: posearray7d_f32, rate_hz: 15}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
outputs:
  nav_goal: {schema: json_utf8, latency_class: best_effort}
  joint_cmd: {schema: jointvec_f32, latency_class: hard_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: hard_rt}
embodiment:
  arm: [franka]
  gripper: any
  base: [mobile]
safety_class: decision
eval: null
origin: agent-authored
source: skills/s3-driver-v1/s3_driver_v1.py
