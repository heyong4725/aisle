# Campaign budget ceilings (T17/PR #24, ADR-21). Frozen (env_hash): a
# research agent must not raise its own budget. Humans change this file
# through an env-change PR only.
#
# Token accounting is external (HAR-5): only the LLM harness can count
# tokens, so the harness ENFORCES episodes and wall-clock, REPORTS the
# token ceiling, and the campaign runner audits token spend against it
# from the manifests' ANTHROPIC_TOKENS_LOG.

[campaign]
# design 9.5: 5M tokens per agent for Phase 2, instrumented, then revisit
tokens = 5000000
# episode ceiling across the whole campaign ledger (8.2.3's
# budget-episodes-left semantics)
episodes = 2000
# wall-clock ceiling in hours, summed over rollouts
wall_h = 100.0
