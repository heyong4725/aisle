      - kind: test
        path: tests/unit/test_validator.py
        node: tests/unit/test_validator.py::test_motion_gate_is_topological
        scope: agnostic
        rationale: Distinguishes topology from node naming and rejects an ungated path.
    counterevidence:
      - The validator does not model arbitrary process, socket, device, or driver side channels.
    limitations:
      - "Wider bypass claims defer to issue #350."
    allowed_wording:
      readme: Accepted declared graph paths route motion through the budget guard.
      technical_report: The validator establishes declared graph-path gating only.
      focused_paper: Declared topology is gated; a process-wide bypass boundary is not claimed.
    headlines:
      - path: docs/AISLE-technical-report.md
