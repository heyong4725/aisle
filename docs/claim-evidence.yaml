        scope: agnostic
        rationale: Exercises malformed and extreme commands against the legal envelope.
    counterevidence:
      - Kinematic clamping does not establish semantic object authorization.
    limitations:
      - "Held-command and safety-exposure effects await issue #351."
    allowed_wording:
      readme: The budget guard clamps commands to its configured kinematic envelope.
      technical_report: Kinematic enforcement is separate from semantic safety.
      focused_paper: The guard enforces configured command bounds on declared paths.
    headlines: []

  - id: safety-semantic
