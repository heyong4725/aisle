schema_version: 1

canonical_status:
  path: README.md
  marker: current-status:canonical
  anchor: "#status"

overview_documents:
  - path: README.md
    role: canonical
  - path: docs/AISLE-technical-report.md
    role: snapshot
    snapshot_date: "2026-08-16"
    canonical_link: ../README.md#status
  - path: docs/Project_AISLE_Experiment_Design.md
    role: snapshot
    snapshot_date: "2026-08-16"
    canonical_link: ../README.md#status
  - path: docs/research-program.md
    role: snapshot
    snapshot_date: "2026-08-28"
    canonical_link: ../README.md#status
  - path: docs/experiments.md
    role: snapshot
    snapshot_date: "2026-08-28"
    canonical_link: ../README.md#status
  - path: docs/paper/aisle-paper.md
    role: snapshot
    snapshot_date: "2026-08-31"
    canonical_link: ../../README.md#status

architecture:
  path: docs/architecture.md
  marker: architecture/four-zone-boundary
  experimental_unit: coding_agent_session
  zones:
    mutable_participant: >-
      Coding agent, workspace, declared robot graph, participant nodes, and
      allowed configuration.
    frozen_evaluator: >-
      Hash-checked task, scorer, admissibility, and analysis artifacts.
    trusted_actuation: >-
      Scoped validator and command-guard boundary for declared graph paths.
    hidden_controller: >-
      Task selection, randomization, seeds, sealed faults, and assignment.
  inaccessible:
    - Sealed task and fault contents held outside the participant workspace.
    - Held-out assignments and controller secrets not mounted for the participant.
  forbidden:
    - Direct actuation outside declared participant interfaces.
    - Editing frozen evaluator artifacts or inspecting sealed answers.
  threat_model_issue: "#350"

publications:
  technical_report:
    path: docs/AISLE-technical-report.md
    marker: publication-purpose/technical-report
    purpose: Preserve the complete systems and historical project record.
    in_scope:
      - complete_project_record
      - historical_development_results
      - teaching_and_system_detail
    out_of_scope:
      - focused_confirmatory_headline
      - causal_superiority_without_control
  focused_paper:
    path: docs/paper/aisle-paper.md
    marker: publication-purpose/focused-paper
    purpose: >-
      Test typed versus monolithic engineering and typed evidence versus
      conventional logs under frozen confirmatory protocols.
    in_scope:
      - focused_confirmatory_headline
      - scoped_safety_boundary
      - independent_reproduction
    out_of_scope:
      - historical_development_results
      - complete_project_record

terminology_review:
  status: pending
  required_before: public_benchmark_release
  review_record:
    value: not_applicable
    rationale: >-
      No reviewer outside the wording and catalog authorship chain has yet
      signed and dispositioned a terminology review; release remains blocked.

claims:
  - id: typed-composition
    claim: >-
      AISLE implements a typed capability registry and static graph validator
      that reject incompatible declared graph structures with stable errors.
    type: structural
    status: supported
    scope:
      environment: agnostic
      task: shipped AISLE graph corpus
      perception: all declared rungs
      agent_model: any participant using the repository interface
      platform: repository-supported Python hosts
    experimental_unit:
      value: not_applicable
      rationale: This is a structural property of tracked code and fixtures.
    sample:
      value: not_applicable
      rationale: Structural source and corpus tests are not sampled sessions.
    uncertainty:
      value: not_applicable
      rationale: Sampling uncertainty does not apply to the structural claim.
    attestation:
      status: repository_verified
      rationale: Tracked implementation and independently invoked unit tests establish the scope.
    evidence:
      - kind: source
        path: src/aisle/harness/validate.py
        scope: agnostic
        rationale: Implements schema, topology, embodiment, and stable-error validation.
      - kind: test
        path: tests/unit/test_validator.py
        node: tests/unit/test_validator.py::test_every_shipped_graph_validates
        scope: agnostic
        rationale: Exercises every shipped tracked graph through the validator.
    counterevidence:
      - Graph validity does not establish that external packages are installed or a graph launches.
    limitations:
      - The claim concerns declared structures, not arbitrary participant process behavior.
      - Runtime success and causal engineering benefit require separate evidence.
    allowed_wording:
      readme: AISLE implements typed capability composition and static graph validation.
      technical_report: Tracked tests support the declared typed-graph validation contract.
      focused_paper: The implemented substrate statically validates declared typed graphs.
    headlines:
      - path: README.md
        marker: typed-composition/readme
      - path: docs/paper/aisle-paper.md
        marker: typed-composition/paper-abstract
      - path: docs/paper/aisle-paper.md
        marker: typed-composition/paper-contributions

  - id: typed-dataflow-causal
    claim: >-
      Typed dataflow engineering improves coding-agent outcomes relative to an
      equal-capability monolithic interface.
    type: causal
    status: unrun
    scope:
      environment: simulation
      task: "non-oracle benchmark task band pending issue #346"
      perception: frozen by the future protocol
      agent_model: randomized coding-agent sessions
      platform: frozen campaign platform
    experimental_unit: coding_agent_session
    sample:
      value: not_applicable
      rationale: Confirmatory sessions have not been collected.
    uncertainty:
      value: not_applicable
      rationale: No treatment estimate exists before the controlled campaign.
    attestation:
      status: not_applicable
      rationale: No confirmatory treatment records exist.
    evidence:
      - value: not_applicable
        rationale: "Issue #347 remains dependent on controls and protocol freeze."
    counterevidence:
      - Historical single-session ablations do not isolate typed dataflow structure.
      - The monolithic equal-capability control has not run.
    limitations:
      - No superiority, equivalence, or non-inferiority conclusion is currently allowed.
    allowed_wording:
      readme: "UNRUN: typed-versus-monolithic superiority is the confirmatory claim under test."
      technical_report: "UNRUN: historical development results do not establish the causal effect."
      focused_paper: "UNRUN: no typed-dataflow treatment effect is reported."
    headlines:
      - path: README.md
        marker: typed-dataflow-causal/readme
      - path: docs/paper/aisle-paper.md
        marker: typed-dataflow-causal/paper-abstract
      - path: docs/paper/aisle-paper.md
        marker: typed-dataflow-causal/paper-introduction
      - path: docs/paper/aisle-paper.md
        marker: typed-dataflow-causal/paper-contributions

  - id: typed-evidence-causal
    claim: >-
      Typed runtime evidence improves hidden-fault localization and repair
      relative to conventional logs under a sealed fault assignment.
    type: causal
    status: unrun
    scope:
      environment: simulation
      task: "sealed live-fault bank pending issue #348"
      perception: fault-stratified
      agent_model: randomized coding-agent sessions
      platform: frozen campaign platform
    experimental_unit: coding_agent_session
    sample:
      value: not_applicable
      rationale: Comparator sessions have not been collected.
    uncertainty:
      value: not_applicable
      rationale: No session-level treatment estimate exists.
    attestation:
      status: not_applicable
      rationale: No confirmatory comparator records exist.
    evidence:
      - value: not_applicable
        rationale: "Issue #349 awaits the sealed bank, comparator, and protocol freeze."
    counterevidence:
      - The H6 feasibility cells exposed typed evidence to every participant and had no logs-only arm.
    limitations:
      - Feasibility cannot be relabeled as a comparative localization benefit.
    allowed_wording:
      readme: "UNRUN: typed evidence versus conventional logs has no treatment result."
      technical_report: "UNRUN: H6 is feasibility evidence, not a logs comparator."
      focused_paper: "UNRUN: no typed-evidence localization effect is reported."
    headlines:
      - path: docs/paper/aisle-paper.md
        marker: typed-evidence-causal/paper-abstract
      - path: docs/paper/aisle-paper.md
        marker: typed-evidence-causal/paper-contributions

  - id: live-fault-feasibility
    claim: >-
      In three retained development cells, one per perception, decision, and
      motion fault tier, an agent using live evidence detected the fault,
      localized the designated node, and restored the measured task outcome.
    type: empirical
    status: supported
    scope:
      environment: simulation
      task: H6 induced-fault development cells F1, F2, and F3
      perception: fault-dependent
      agent_model: recorded operator-agent sessions
      platform: development Mac campaign host
    experimental_unit: coding_agent_session
    sample: 3 sessions; one per fault tier; no repeated-session population inference
    uncertainty: Descriptive 3/3 existence result; no interval used for a population claim
    attestation:
      status: repository_recorded
      rationale: Cell records and scorer are retained; no independent reproduction exists.
    evidence:
      - kind: protocol
        path: docs/decisions/ADR-h6-operation-protocol.md
        scope: simulation
        rationale: Declares cell scoring, evidence set, and amendments.
      - kind: raw_record
        path: analysis/h6/records/F1/cell.json
        scope: simulation
        rationale: Retained perception-fault cell record.
      - kind: raw_record
        path: analysis/h6/records/F2/cell.json
        scope: simulation
        rationale: Retained decision-fault cell record.
      - kind: raw_record
        path: analysis/h6/records/F3/cell.json
        scope: simulation
        rationale: Retained motion-fault cell record.
      - kind: analyzer
        path: tools/h6_campaign.py
        scope: agnostic
        rationale: Implements cell and campaign verdict derivation.
    counterevidence:
      - There is no conventional-logs comparator and only one session per fault tier.
    limitations:
      - This supports only the recorded 3/3 feasibility statement.
      - It does not support a typed-evidence advantage or general repair rate.
    allowed_wording:
      readme: "SUPPORTED bounded feasibility: the three retained H6 cells met their criteria."
      technical_report: "SUPPORTED bounded feasibility in 3/3 development cells, without comparison."
      focused_paper: "SUPPORTED bounded feasibility; not a typed-evidence treatment effect."
    headlines:
      - path: README.md
        marker: live-fault-feasibility/readme
      - path: docs/paper/aisle-paper.md
        marker: live-fault-feasibility/paper-abstract
      - path: docs/paper/aisle-paper.md
        marker: live-fault-feasibility/paper-contributions

  - id: development-ledger
