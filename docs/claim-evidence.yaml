    counterevidence:
      - The ledger contains heterogeneous historical evidence and is not a pooled benchmark result.
    limitations:
      - Individual rows retain their own evidentiary strength and may predate SPEC 410.
    allowed_wording:
      readme: The README is the canonical dated development-status ledger.
      technical_report: Dated report snapshots defer to the README status ledger.
      focused_paper: Historical status is supplemental and defers to the README ledger.
