name: nightly
# Manual dispatch only. GitHub-hosted macOS runners expose no Metal device, so
# the Genesis sim/graph/acceptance suites failed there every night with
# "MPS backend out of memory" before running a single episode. Those suites
# are run locally before each merge (docs/contributor-wiki.md); dispatch this
# workflow from a runner with a GPU when one exists.
on:
  workflow_dispatch:
jobs:
  sim-graph-accept:
    name: nightly/sim-graph-accept
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra sim
      - run: uv tool install dora-rs-cli==1.0.1
      - run: uv run pytest -m "sim or graph or accept" -q
