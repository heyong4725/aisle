name: ci
on: [pull_request, push]
jobs:
  unit:
    name: ci/unit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the CON-11 mainline-subject gate scans origin/main;
          # a depth-1 checkout silently skips it (PR #17 review)
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # gate the PR TITLE before squash-merge can mint a non-conventional
      # mainline subject (CON-11). Env-var indirection: a title with shell
      # metacharacters must not inject into the run script.
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python tools/check_pr_title.py "$PR_TITLE"
      - run: uv run ruff format --check . && uv run ruff check .
      - run: uv run pytest -m unit
      - run: uv run python tools/trace_check.py

  # Linux unit PORTABILITY coverage (PR #83 review: this is NOT a CON-1
  # runtime check — CON-1's Metal/MPS runtime half needs a macOS arm64
  # sim job, and the locked-graph CUDA screen already lives in the
  # bootstrap test). What this job proves: the default `uv sync`
  # dependency set installs and the pure/CON-12 unit surface passes on
  # a Linux CPU host — which caught #82's host-dependent git identity.
  # Deliberately unit-only: ruff, trace_check and the PR-title gate are
  # platform-independent, so ci/unit already covers them once.
  unit-linux:
    name: ci/unit-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # same reason as ci/unit: the CON-11 mainline-subject test SKIPS on a
          # shallow checkout, so depth-1 would silently under-run this job too
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -m unit
