# Phase 5.1 (next-phases.md RATIFIED; ADR-38): SmolVLA behind the typed
# contract. Zero-shot on this scene EXPECTED near 0 (SO-100/101
# tabletop training data); the evalcard records the honest measured
# rate — fine-tuning is the follow-on. Weights: lerobot/smolvla_base @
# c83c3163 (pinned in src/aisle/nodes/vla_backend.py).
id: vla-policy-smolvla
kind: node
provides: [manipulation_policy]
requires: [episode_verification]
inputs:
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
  rgb_overhead: {schema: rgb8_image, rate_hz: 15}
  rgb_wrist: {schema: rgb8_image, rate_hz: 15}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  target_request: {schema: json_utf8, rate_hz: 1}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
outputs:
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
  joint_cmd: {schema: jointvec_f32, latency_class: soft_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: soft_rt}
embodiment:
  arm: [franka, so101]
  gripper: parallel
safety_class: motion
eval:
  suite: t1-zeroshot-freerun
  pass_rate: 0.0
  last_run: '2026-08-17'

origin: hub
source: src/aisle/nodes/vla_smolvla.py
