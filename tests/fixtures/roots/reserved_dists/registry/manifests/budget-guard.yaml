id: budget-guard
kind: node
provides:
- budget_guard
requires: []
inputs:
  joint_cmd:
    schema: jointvec_f32
    rate_hz: 100
  gripper_cmd:
    schema: scalar_f32
    rate_hz: 30
  base_cmd:
    schema: base_cmd2d_f32
    rate_hz: 50
  base_pose:
    schema: base_pose3d_f32
    rate_hz: 50
  base_watchdog:
    schema: timer_tick
    rate_hz: 20
  reset_done:
    schema: reset_done_u32
    rate_hz: 1
  tick:
    schema: timer_tick
    rate_hz: 0.2
outputs:
  joint_cmd_safe:
    schema: jointvec_f32
    latency_class: hard_rt
  gripper_cmd_safe:
    schema: scalar_f32
    latency_class: hard_rt
  base_cmd_safe:
    schema: base_cmd2d_f32
    latency_class: hard_rt
  violation:
    schema: json_utf8
    latency_class: best_effort
  guard_stats:
    schema: json_utf8
    latency_class: best_effort
embodiment:
  arm:
  - franka
  - so101
  gripper: any
safety_class: motion
eval:
  suite: tests/graph/test_guard_in_graph.py (SPEC 080 adversarial)
  pass_rate: 1.0
  last_run: '2026-08-03'
origin: hub
source: src/aisle/nodes/budget_guard.py
