# BND-2/BND-3: controller-owned public field projection, outside policy edits.
id: pilot-policy-surface
kind: node
provides: [pilot_public_observations]
requires: [episode_driving]
inputs:
  bridge_info: {schema: json_utf8, rate_hz: 1}
  episode_goal: {schema: json_utf8, rate_hz: 1}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  bridge_info: {schema: json_utf8, latency_class: best_effort}
  episode_goal: {schema: json_utf8, latency_class: best_effort}
  reset_done: {schema: reset_done_u32, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  arm: [franka]
  gripper: parallel
safety_class: decision
eval:
  suite: tests/unit/test_pilot_policy_surface.py (11 public-projection unit checks; engineering only)
  pass_rate: 1.0
  last_run: '2026-09-12'
origin: agent-authored
source: src/aisle/harness/pilot_policy_surface.py
