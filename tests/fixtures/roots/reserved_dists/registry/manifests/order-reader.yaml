id: order-reader
kind: node
provides:
- order_reading
requires: []
inputs:
  episode_goal:
    schema: json_utf8
    rate_hz: 1
  turn:
    schema: sim_turn_u64
    rate_hz: 100
    is_clock: true
outputs:
  order:
    schema: json_utf8
    latency_class: best_effort
  turn_done:
    schema: sim_turn_u64
    latency_class: hard_rt
embodiment:
  arm:
  - franka
  - so101
  gripper: any
safety_class: perception
eval: null
origin: hub
source: src/aisle/nodes/order_reader.py
