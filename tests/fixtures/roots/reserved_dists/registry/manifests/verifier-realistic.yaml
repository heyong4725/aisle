id: verifier-realistic
kind: node
provides: [episode_verification_realistic]
requires: [rgb_stream, depth_stream, arm_state]
inputs:
  bridge_info: {schema: json_utf8, rate_hz: 1}
  episode_goal: {schema: json_utf8, rate_hz: 1}
  reset: {schema: reset_request_u32, rate_hz: 1}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  rgb_overhead: {schema: rgb8_image, rate_hz: 30}
  depth_overhead: {schema: depth_f32, rate_hz: 15}
  rgb_wrist: {schema: rgb8_image, rate_hz: 30}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  episode_result: {schema: json_utf8, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  arm: [franka, so101]
  gripper: any
safety_class: decision
eval: null
origin: hub
source: src/aisle/nodes/verifier_realistic.py
