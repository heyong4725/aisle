id: arm-driver-sim
kind: node
provides:
- arm_actuation
requires: []
inputs:
  joint_cmd:
    schema: jointvec_f32
    rate_hz: 100
outputs:
  joint_state:
    schema: jointvec_f32
    latency_class: hard_rt
embodiment:
  arm:
  - franka
  - so101
  gripper: any
safety_class: motion
eval:
  suite: tests/accept/test_contract.py (TC-A1..A3)
  pass_rate: 1.0
  last_run: '2026-07-20'
origin: hub
source: src/aisle/nodes/dora_genesis.py
