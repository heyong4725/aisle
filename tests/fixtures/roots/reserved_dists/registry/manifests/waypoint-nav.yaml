id: waypoint-nav
kind: node
provides:
- waypoint_navigation
requires: []
inputs:
  nav_goal:
    schema: json_utf8
    rate_hz: 1
  base_pose:
    schema: base_pose3d_f32
    rate_hz: 50
  tick:
    schema: timer_tick
    rate_hz: 50
outputs:
  nav_feedback:
    schema: json_utf8
    latency_class: best_effort
  nav_result:
    schema: json_utf8
    latency_class: best_effort
  base_cmd:
    schema: base_cmd2d_f32
    latency_class: soft_rt
embodiment:
  arm:
  - franka
  gripper: any
  base:
  - mobile
safety_class: motion
eval:
  suite: tests/accept/test_contract_mobile.py (MOB-2 nav lifecycle)
  pass_rate: 1.0
  last_run: '2026-08-03'
origin: hub
source: src/aisle/nodes/nav_action.py
