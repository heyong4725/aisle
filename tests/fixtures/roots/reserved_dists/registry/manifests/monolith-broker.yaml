# SPEC 440: the monolithic arm's trusted primitive broker. One node in
# place of the typed graph's segmented-pose + grasp-planner-topdown +
# ik-trajectory + task-state-machine, executing ONE agent-editable module
# (graph env AISLE_MONOLITH_MODULE, attested by the graph hash) against
# the frozen primitive API. Its commands take the same guard route.
id: monolith-broker
kind: node
# one capability of its own: it does not compete with the typed nodes in
# registry search (CAP-4); the typed graph and this graph are alternatives
provides: [monolithic_control]
requires: [episode_verification]
inputs:
  bridge_info: {schema: json_utf8, rate_hz: 1}
  seg_overhead: {schema: seg_i32, rate_hz: 15}
  depth_overhead: {schema: depth_f32, rate_hz: 15}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  gripper_state: {schema: scalar_f32, rate_hz: 100}
  episode_goal: {schema: json_utf8, rate_hz: 1}
  episode_result: {schema: json_utf8, rate_hz: 1}
  violation: {schema: json_utf8, rate_hz: 1, turn_edge: episodic}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  joint_cmd: {schema: jointvec_f32, latency_class: soft_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: soft_rt}
  episode_feedback: {schema: json_utf8, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  arm: [franka, so101]
  gripper: parallel
safety_class: motion
eval:
  suite: tests/graph/test_monolithic_graph.py (expert parity shakeout, seeds 0..7)
  pass_rate: 1.0
  last_run: '2026-09-05'
origin: agent-authored
source: src/aisle/nodes/monolith_broker.py
