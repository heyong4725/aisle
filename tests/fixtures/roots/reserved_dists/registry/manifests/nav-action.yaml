id: nav-action
kind: node
provides: [navigation]
requires: []
inputs:
  # SPEC 210 MOB-2: goal_id action — {location} or {pose:[x,y,yaw]}
  nav_goal: {schema: json_utf8, rate_hz: 1}
  # base pose feedback (MOB-1) the controller drives from — also the control
  # clock (ADR-29): one iteration per pose at the 50 Hz SIM cadence, so the
  # >=2 Hz MOB-2 feedback needs no wall timer (CON-5)
  base_pose: {schema: base_pose3d_f32, rate_hz: 50}
  # the EPISODE boundary (issue #179): nav must abandon an in-flight goal
  # when the episode ends, or the leg survives into the next one and its
  # nav_result completes a different episode's subtask
  reset_done: {schema: reset_done_u32, rate_hz: 1, turn_edge: episodic}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  # >=2 Hz lifecycle (MOB-2): {t, dist_remaining} then {status, failure, t_end}
  nav_feedback: {schema: json_utf8, latency_class: best_effort}
  nav_result: {schema: json_utf8, latency_class: best_effort}
  # diff-drive command to the budget guard (MOB-3), never straight to the bridge
  base_cmd: {schema: base_cmd2d_f32, latency_class: soft_rt}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
embodiment:
  # mobile only: navigation needs a base profile (MOB-4). gripper: any — the
  # nav node does not actuate a gripper (schema requires the field)
  arm: [franka]
  gripper: any
  base: [mobile]
safety_class: motion
eval:
  suite: tests/accept/test_contract_mobile.py (MOB-2 nav lifecycle)
  pass_rate: 1.0
  last_run: '2026-08-03'
origin: hub
source: src/aisle/nodes/nav_action.py
