id: budget-guard
kind: node
provides:
- budget_guard
requires: []
inputs:
  joint_cmd:
    schema: jointvec_f32
    rate_hz: 100
outputs:
  joint_cmd_safe:
    schema: jointvec_f32
    latency_class: hard_rt
embodiment:
  arm:
  - franka
  - so101
  gripper: any
# ADR-5 ratified boundary: the guard emits joint_cmd_safe, so it is
# motion-class — and the VAL-5 sink EXEMPTION (validate.py, node_id !=
# GUARD_ID) is what these fixtures now exercise: raw commands into the
# guard are legal, it IS the gate
safety_class: motion
eval:
  suite: fixture stand-in (SPEC 080 adversarial)
  pass_rate: 1.0
  last_run: '2026-08-03'
origin: hub
source: src/aisle/nodes/budget-guard.py
