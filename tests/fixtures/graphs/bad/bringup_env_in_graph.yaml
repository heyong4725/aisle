# ADR-25 / PR #80 review P1: the good-corpus perception_min graph with
# the bridge's bring-up opt-out injected via node env — the graph-YAML
# channel the rollout runner's os.environ scrub cannot reach. A measured
# rollout on this graph would free-run before the first reset (the exact
# issue-#71 race); the validator must fail closed.
nodes:
- id: dora-genesis
  inputs:
    tick: dora/timer/millis/10
  outputs:
  - poses
  env:
    AISLE_STEP_WITHOUT_RESET: '1'
- id: oracle-pose
  inputs:
    poses: dora-genesis/poses
  outputs:
  - target_pose
