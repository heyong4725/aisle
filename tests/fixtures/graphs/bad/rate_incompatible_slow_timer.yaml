# warning-only fixture on a LAUNCHABLE node (PR #34 review: keeping the
# detector here lost the corpus's only codes=[] entries, killing coverage
# of "warnings alone still exit 0"): genesis tick declares 100 Hz, a 1 Hz
# timer is far below the TC-4 band
nodes:
- id: dora-genesis
  inputs:
    tick: dora/timer/millis/1000
  outputs:
  - poses
