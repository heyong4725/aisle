# VAL-7 golden corpus expectations: file stem -> EXACT expected error-code set
# (and optional embodiment flag / expected warning codes).
# Every agent-discovered failure class MUST gain an entry here in the same
# PR that handles it (VAL-7).

# INSTALL_MISSING appears alongside many entries below: the corpus was
# historically built on detector-openvocab/pose-estimator/ocr-label, whose
# pip: distributions are not installed (the H1-discovered class,
# analysis/h1/h1_findings.md) — the code is inherent to those fixtures,
# not incidental.

# both typo nodes consume oracle_state, and an unresolved consumer is never
# an authorized verifier (VAL-6 strict rule), so the leak fires alongside
[manifest_missing_typo_oracle_pos]
codes = ["MANIFEST_MISSING", "ORACLE_LEAK"]

[manifest_missing_unknown_node]
codes = ["MANIFEST_MISSING"]

[manifest_missing_typo_verifier]
codes = ["MANIFEST_MISSING", "ORACLE_LEAK"]

