# Partial manifest-input wiring is legal (ADR 5): oracle-pose wires poses but
# leaves reset_done and target_request unwired; camera-source exposes a spare
# RGB output. Simulator graphs use the complete lockstep expert goldens.
nodes:
- id: camera-source
  outputs:
  - poses
  - rgb_overhead
- id: oracle-pose
  inputs:
    poses: camera-source/poses
  outputs:
  - target_pose
