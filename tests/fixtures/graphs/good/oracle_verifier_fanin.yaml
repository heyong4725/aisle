# Multi-consumer fan-out on installed non-simulator registry nodes:
# camera-source feeds both perception and the verifier; oracle_state reaches
# ONLY verifier-* (VAL-6 legal use). Simulator graphs additionally require
# ADR-30 lockstep topology.
nodes:
- id: camera-source
  outputs:
  - poses
  - oracle_state
- id: oracle-pose
  inputs:
    poses: camera-source/poses
  outputs:
  - target_pose
- id: verifier-oracle
  inputs:
    oracle_state: camera-source/oracle_state
  outputs:
  - episode_result
