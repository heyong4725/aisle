# Campaign t2_breakthrough agent-2: ik-trajectory with a FAR-FIRST read
# ladder. Offline collision audit of the arm-L T2 runs put every knock
# at the read park approach/advance (fingertips ~7.7cm nominal from the
# face at the stock 0.13m preferred range); offline IK audit shows flat
# 0.20/0.24m entries solve and stage at the same rate with 14.7/18.7cm
# clearance. Grasp pipeline, staged backoff, tracking tolerance, and
# retreat-via-home are the curated ik-trajectory unchanged (wrapper
# module patches only solve_read_poses' ladder tables and selector).
id: t2-read-ladder
kind: node
provides: [trajectory_generation]
requires: [grasp_planning]
inputs:
  grasp_pose: {schema: pose7d_f32, rate_hz: 30}
  read_move: {schema: json_utf8, rate_hz: 1}
  joint_state: {schema: jointvec_f32, rate_hz: 100}
  reset_done: {schema: reset_done_u32, rate_hz: 1}
  turn: {schema: sim_turn_u64, rate_hz: 100, is_clock: true}
outputs:
  joint_cmd: {schema: jointvec_f32, latency_class: soft_rt}
  gripper_cmd: {schema: scalar_f32, latency_class: soft_rt}
  move_done: {schema: json_utf8, latency_class: best_effort}
  plan_done: {schema: json_utf8, latency_class: best_effort}
  turn_done: {schema: sim_turn_u64, latency_class: hard_rt}
params:
  max_joint_vel_rad_s: {type: float, default: 1.0, range: [0.1, 2.0]}
embodiment:
  arm: [franka]
  gripper: parallel
safety_class: motion
eval: null
origin: agent-authored
source: skills/t2-read-ladder/t2_read_ladder.py
