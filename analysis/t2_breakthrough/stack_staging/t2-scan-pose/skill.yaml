# Campaign arm-L T2 (idea I6): candidate box positions for the T2 scan
# tour WITHOUT l2_pose's identity gate. Measured on run
# 20260813-162725-2be572 (stock expert_t2 pipeline, seeds 0..9, pass1
# 0.10): the identity-margin and target-footprint refusals starved the
# tour in 5/10 episodes — but at T2 AISLE_SHUFFLE_COLORS makes detector
# identity noise BY DESIGN; the tour only needs POSITIONS, and identity
# safety lives in the label reader's margin floors. Anchor = best
# confident detection (any label); tour_candidates metadata carries the
# other confident boxes' full [x, y, z] (boxes sit on different shelf
# levels — l2_pose's z-inherit read cross-level candidates blank);
# neighbours stays the planner's positional per-med payload.
id: t2-scan-pose
kind: node
provides: [object_pose, scan_candidates]
requires: []
inputs:
  bridge_info: {schema: json_utf8, rate_hz: 1}
  rgb_overhead: {schema: rgb8_image, rate_hz: 30}
  depth_overhead: {schema: depth_f32, rate_hz: 15}
  target_request: {schema: json_utf8, rate_hz: 1}
  # episode boundary: clears the active target (T08 parity with oracle-pose)
  reset_done: {schema: reset_done_u32, rate_hz: 1}
outputs:
  target_pose: {schema: pose7d_f32, latency_class: best_effort}
embodiment:
  arm: [franka, so101]
  gripper: any
safety_class: perception
eval: null
origin: agent-authored
source: skills/t2-scan-pose/t2_scan_pose.py
