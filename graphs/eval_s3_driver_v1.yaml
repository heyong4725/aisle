# Campaign H3-S3 agent graph: the store graph pointed at the S3
# re-shelving tier with the agent-authored s3-driver-v1 skill. The driver
# plans directly from the episode goal (`misplaced` entries) and executes
# the 3-move counter-buffered swap. Every motion edge (arm AND base)
# routes through budget-guard (VAL-5/MOB-3); oracle_state feeds only the
# verifier (VAL-6); perception rides the non-privileged `poses` topic.
nodes:
  - id: dora-genesis
    path: ../src/aisle/nodes/dora_genesis.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_OUTPUTS: 'bridge_info,joint_state,gripper_state,oracle_state,poses,reset_done,base_pose,base_scan,frame_info,rgb_overhead,sim_turn'
      AISLE_SCENE: store
      AISLE_SCENARIO: S3
      AISLE_EMBODIMENT: mobile
    inputs:
      tick: dora/timer/millis/10
      joint_cmd:
        source: budget-guard/joint_cmd_safe
        queue_size: 100
      gripper_cmd:
        source: budget-guard/gripper_cmd_safe
        queue_size: 100
      base_cmd:
        source: budget-guard/base_cmd_safe
        queue_size: 100
      reset:
        source: reset/bridge_reset
        queue_size: 100
      turn_commit:
        source: turn-barrier/turn_commit
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - bridge_info
      - joint_state
      - gripper_state
      - oracle_state
      - poses
      - reset_done
      - base_pose
      - base_scan
      - frame_info
      # HAR-4: the harness's trace recorder builds overhead.mp4 from this
      # stream (undeclared, dora drops it — PR #21)
      - rgb_overhead
      - sim_turn

  - id: reset
    path: ../src/aisle/reset/service.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'reset'
      AISLE_TURN_OUTPUTS: 'bridge_reset,reset_done,reset_refused,turn_done'
    inputs:
      reset:
        source: rollout-client/reset
        queue_size: 100
      reset_done:
        source: dora-genesis/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - bridge_reset
      - reset_done
      - reset_refused
      - turn_done

  - id: budget-guard
    path: ../src/aisle/nodes/budget_guard.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'budget-guard'
      AISLE_TURN_OUTPUTS: 'joint_cmd_safe,gripper_cmd_safe,base_cmd_safe,violation,guard_stats,turn_done'
      AISLE_TURN_WALL_OUTPUTS: 'guard_stats'
      AISLE_EMBODIMENT: mobile
      AISLE_SCENE: store
    inputs:
      tick: dora/timer/millis/5000
      joint_cmd:
        source: s3-driver-v1/joint_cmd
        queue_size: 100
      gripper_cmd:
        source: s3-driver-v1/gripper_cmd
        queue_size: 100
      base_cmd:
        source: waypoint-nav/base_cmd
        queue_size: 100
      base_pose:
        source: dora-genesis/base_pose
        queue_size: 1
      reset_done:
        # the EPISODE boundary comes from the reset SERVICE, not the bridge
        # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
        # the bridge, so dora-genesis/reset_done never fires and every
        # episode-state consumer silently misses the boundary. The service
        # replies on every route -- teleport (it relays the bridge),
        # behavioral success, and behavioral exhaustion via fallback -- so it
        # is the single authority, and it is the same edge rollout-client
        # already waits on before starting the next episode.
        source: reset/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - joint_cmd_safe
      - gripper_cmd_safe
      - base_cmd_safe
      - violation
      - guard_stats
      - turn_done

  - id: waypoint-nav
    path: ../src/aisle/nodes/nav_action.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'waypoint-nav'
      AISLE_TURN_OUTPUTS: 'nav_feedback,nav_result,base_cmd,turn_done'
      AISLE_EMBODIMENT: mobile
    inputs:
      nav_goal:
        source: s3-driver-v1/nav_goal
        queue_size: 100
      base_pose:
        # the control clock (ADR-29): one iteration per pose. Deep enough
        # that scheduler jitter never drops a clock edge (not latest-wins),
        # shallow enough to bound stale-pose replay under pathological load
        source: dora-genesis/base_pose
        queue_size: 10
      reset_done:
        # the EPISODE boundary comes from the reset SERVICE, not the bridge
        # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
        # the bridge, so dora-genesis/reset_done never fires and every
        # episode-state consumer silently misses the boundary. The service
        # replies on every route -- teleport (it relays the bridge),
        # behavioral success, and behavioral exhaustion via fallback -- so it
        # is the single authority, and it is the same edge rollout-client
        # already waits on before starting the next episode.
        source: reset/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - nav_feedback
      - nav_result
      - base_cmd
      - turn_done

  - id: s3-driver-v1
    path: ../skills/s3-driver-v1/s3_driver_v1.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 's3-driver-v1'
      AISLE_TURN_OUTPUTS: 'nav_goal,joint_cmd,gripper_cmd,turn_done'
    inputs:
      episode_goal:
        source: rollout-client/episode_goal
        queue_size: 100
      nav_result:
        source: waypoint-nav/nav_result
        queue_size: 100
      base_pose:
        source: dora-genesis/base_pose
        queue_size: 1
      poses:
        source: dora-genesis/poses
        queue_size: 1
      joint_state:
        source: dora-genesis/joint_state
        # latest-wins: joint_state is STATE (the desk expert lesson)
        queue_size: 1
      reset_done:
        # the EPISODE boundary comes from the reset SERVICE, not the bridge
        # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
        # the bridge, so dora-genesis/reset_done never fires and every
        # episode-state consumer silently misses the boundary. The service
        # replies on every route -- teleport (it relays the bridge),
        # behavioral success, and behavioral exhaustion via fallback -- so it
        # is the single authority, and it is the same edge rollout-client
        # already waits on before starting the next episode.
        source: reset/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - nav_goal
      - joint_cmd
      - gripper_cmd
      - turn_done

  - id: verifier-retail
    path: ../src/aisle/verifier/retail.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'verifier-retail'
      AISLE_TURN_OUTPUTS: 'episode_result,turn_done'
    inputs:
      oracle_state:
        source: dora-genesis/oracle_state
        queue_size: 100
      episode_goal:
        source: rollout-client/episode_goal
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - episode_result
      - turn_done

  - id: rollout-client
    path: ../src/aisle/harness/rollout_client.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'rollout-client'
      AISLE_TURN_OUTPUTS: 'reset,episode_goal,turn_done'
      AISLE_TIER: S3
    inputs:
      tick: dora/timer/millis/1000
      reset_done:
        source: reset/reset_done
        queue_size: 100
      reset_refused:
        source: reset/reset_refused
        queue_size: 100
      episode_result:
        source: verifier-retail/episode_result
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - reset
      - episode_goal
      - turn_done

  - id: turn-barrier
    path: ../src/aisle/nodes/turn_barrier.py
    env:
      AISLE_TURN_PLAN: 'turn_plans/eval_s3_driver_v1.json'
      AISLE_TURN_WATCHDOG_S: '10'
      AISLE_VERDICT_TURN_WATCHDOG_S: '15'
    inputs:
      tick: dora/timer/millis/100
      sim_turn:
        source: dora-genesis/sim_turn
        queue_size: 4
        queue_policy: backpressure
      done_0:
        source: budget-guard/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_1:
        source: reset/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_2:
        source: rollout-client/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_3:
        source: s3-driver-v1/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_4:
        source: verifier-retail/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_5:
        source: waypoint-nav/turn_done
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - turn
      - turn_commit
