# The hand-written T4 expert baseline (design doc §3 tier table;
# ADR-32 increment one): the full request loop — confirm the name back,
# handle a pre-delivery "no, the other one", deliver. Perception is the
# T1 rung (L1 segmented pose); what changes is WHERE the task comes
# from: the task-state-machine consumes NO episode_goal — its task
# arrives as the human-sim's scripted `request`, and the confirm
# exchange must complete before any target_request. The TC-7 goal
# (whose target_med is the FINAL corrected target) reaches only
# verifier-oracle; the validator's DIALOGUE_GOAL_LEAK rule rejects any
# T4 graph that routes it further. The human-sim script is a pure
# function of the per-goal seed (CON-5): corrected seeds (seed%4==0)
# answer the confirm with a correction naming the next med in SCN-2's
# list, and the robot re-confirms once.
nodes:
- id: dora-genesis
  path: ../src/aisle/nodes/dora_genesis.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_OUTPUTS: 'bridge_info,joint_state,gripper_state,oracle_state,rgb_overhead,rgb_wrist,depth_overhead,seg_overhead,reset_done,sim_turn'
    AISLE_PERCEPTION: L1
  inputs:
    tick: dora/timer/millis/10
    joint_cmd:
      source: budget-guard/joint_cmd_safe
      queue_size: 100
    gripper_cmd:
      source: budget-guard/gripper_cmd_safe
      queue_size: 100
    reset:
      source: reset/bridge_reset
      queue_size: 100
    turn_commit:
      source: turn-barrier/turn_commit
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - bridge_info
  - joint_state
  - gripper_state
  - oracle_state
  - rgb_overhead
  - rgb_wrist
  - depth_overhead
  - seg_overhead
  - reset_done
  - sim_turn
- id: reset
  path: ../src/aisle/reset/service.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'reset'
    AISLE_TURN_OUTPUTS: 'bridge_reset,reset_done,turn_done'
  inputs:
    reset:
      source: rollout-client/reset
      queue_size: 100
    reset_done:
      source: dora-genesis/reset_done
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - bridge_reset
  - reset_done
  - turn_done
- id: budget-guard
  path: ../src/aisle/nodes/budget_guard.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'budget-guard'
    AISLE_TURN_OUTPUTS: 'joint_cmd_safe,gripper_cmd_safe,violation,guard_stats,turn_done'
    AISLE_TURN_WALL_OUTPUTS: 'guard_stats'
  inputs:
    tick: dora/timer/millis/5000
    joint_cmd:
      source: ik-trajectory/joint_cmd
      queue_size: 100
    gripper_cmd:
      source: ik-trajectory/gripper_cmd
      queue_size: 100
    reset_done:
      # the EPISODE boundary comes from the reset SERVICE, not the bridge
      # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
      # the bridge, so dora-genesis/reset_done never fires and every
      # episode-state consumer silently misses the boundary. The service
      # replies on every route -- teleport (it relays the bridge),
      # behavioral success, and behavioral exhaustion via fallback -- so it
      # is the single authority, and it is the same edge rollout-client
      # already waits on before starting the next episode.
      source: reset/reset_done
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - joint_cmd_safe
  - gripper_cmd_safe
  - violation
  - guard_stats
  - turn_done
- id: segmented-pose
  path: ../src/aisle/nodes/segmented_pose.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'segmented-pose'
    AISLE_TURN_OUTPUTS: 'target_pose,turn_done'
  inputs:
    bridge_info:
      source: dora-genesis/bridge_info
      queue_size: 100
    seg_overhead:
      source: dora-genesis/seg_overhead
      queue_size: 100
    depth_overhead:
      source: dora-genesis/depth_overhead
      queue_size: 100
    target_request:
      source: task-state-machine/target_request
      queue_size: 100
    reset_done:
      # the EPISODE boundary comes from the reset SERVICE, not the bridge
      # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
      # the bridge, so dora-genesis/reset_done never fires and every
      # episode-state consumer silently misses the boundary. The service
      # replies on every route -- teleport (it relays the bridge),
      # behavioral success, and behavioral exhaustion via fallback -- so it
      # is the single authority, and it is the same edge rollout-client
      # already waits on before starting the next episode.
      source: reset/reset_done
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - target_pose
  - turn_done
- id: grasp-planner-topdown
  path: ../src/aisle/nodes/grasp_topdown.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'grasp-planner-topdown'
    AISLE_TURN_OUTPUTS: 'grasp_pose,turn_done'
  inputs:
    target_pose:
      source: segmented-pose/target_pose
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - grasp_pose
  - turn_done
- id: ik-trajectory
  path: ../src/aisle/nodes/ik_trajectory.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'ik-trajectory'
    AISLE_TURN_OUTPUTS: 'joint_cmd,gripper_cmd,plan_done,turn_done'
  inputs:
    grasp_pose:
      source: grasp-planner-topdown/grasp_pose
      queue_size: 100
    joint_state:
      source: dora-genesis/joint_state
      queue_size: 1
    reset_done:
      # the EPISODE boundary comes from the reset SERVICE, not the bridge
      # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
      # the bridge, so dora-genesis/reset_done never fires and every
      # episode-state consumer silently misses the boundary. The service
      # replies on every route -- teleport (it relays the bridge),
      # behavioral success, and behavioral exhaustion via fallback -- so it
      # is the single authority, and it is the same edge rollout-client
      # already waits on before starting the next episode.
      source: reset/reset_done
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - joint_cmd
  - gripper_cmd
  - plan_done
  - turn_done
- id: verifier-oracle
  path: ../src/aisle/verifier/oracle.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'verifier-oracle'
    AISLE_TURN_OUTPUTS: 'episode_result,turn_done'
  inputs:
    oracle_state:
      source: dora-genesis/oracle_state
      queue_size: 100
    joint_state:
      source: dora-genesis/joint_state
      queue_size: 100
    episode_goal:
      source: rollout-client/episode_goal
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - episode_result
  - turn_done
- id: human-sim
  path: ../src/aisle/nodes/human_sim.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'human-sim'
    AISLE_TURN_OUTPUTS: 'human_msg,turn_done'
  inputs:
    episode_meta:
      source: rollout-client/episode_meta
      queue_size: 100
    robot_msg:
      source: task-state-machine/robot_msg
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - human_msg
  - turn_done
- id: task-state-machine
  path: ../src/aisle/nodes/task_state_machine.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'task-state-machine'
    AISLE_TURN_OUTPUTS: 'target_request,episode_feedback,robot_msg,turn_done'
    AISLE_TASK_TIER: T4
    AISLE_MAX_RETRIES: '8'
  inputs:
    tick: dora/timer/millis/1000
    human_msg:
      source: human-sim/human_msg
      queue_size: 100
    episode_result:
      source: verifier-oracle/episode_result
      queue_size: 100
    violation:
      source: budget-guard/violation
      queue_size: 100
    plan_done:
      source: ik-trajectory/plan_done
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - target_request
  - episode_feedback
  - robot_msg
  - turn_done
- id: rollout-client
  path: ../src/aisle/harness/rollout_client.py
  env:
    AISLE_LOCKSTEP: '1'
    AISLE_TURN_NODE: 'rollout-client'
    AISLE_TURN_OUTPUTS: 'reset,episode_goal,episode_meta,turn_done'
  inputs:
    tick: dora/timer/millis/1000
    reset_done:
      source: reset/reset_done
      queue_size: 100
    episode_result:
      source: verifier-oracle/episode_result
      queue_size: 100
    episode_feedback:
      source: task-state-machine/episode_feedback
      queue_size: 100
    turn:
      source: turn-barrier/turn
      queue_size: 4
      queue_policy: backpressure
  outputs:
  - reset
  - episode_goal
  - episode_meta
  - turn_done
- id: turn-barrier
  path: ../src/aisle/nodes/turn_barrier.py
  env:
    AISLE_TURN_PLAN: 'turn_plans/expert_t4.json'
    AISLE_TURN_WATCHDOG_S: '10'
    AISLE_VERDICT_TURN_WATCHDOG_S: '15'
  inputs:
    tick: dora/timer/millis/100
    sim_turn:
      source: dora-genesis/sim_turn
      queue_size: 4
      queue_policy: backpressure
    done_0:
      source: budget-guard/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_1:
      source: grasp-planner-topdown/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_2:
      source: human-sim/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_3:
      source: ik-trajectory/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_4:
      source: reset/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_5:
      source: rollout-client/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_6:
      source: segmented-pose/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_7:
      source: task-state-machine/turn_done
      queue_size: 4
      queue_policy: backpressure
    done_8:
      source: verifier-oracle/turn_done
      queue_size: 4
      queue_policy: backpressure
  outputs:
    - turn
    - turn_commit
