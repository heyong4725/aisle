# The hand-written T1 expert baseline at perception rung L2 (TC-9;
# design doc §7 ladder; idea I7). Identical to expert_t1.yaml except the
# pose source: the bridge publishes NEITHER simulator ground-truth pose nor
# segmentation (`poses` nor `seg_overhead`). Identity comes only from RGB;
# same-stamp ordinary sensor depth supplies metric geometry.
# detected-pose runs the pinned OWLv2 detector (the frozen verifier's
# model, read-only) with a MEASURED identity-margin floor: a low-margin
# detection is refused, because a wrong-medicine pick is 10x worse than
# a timeout. Everything downstream of target_pose is unchanged.
nodes:
- id: dora-genesis
  path: ../src/aisle/nodes/dora_genesis.py
  env:
    AISLE_PERCEPTION: L2
  inputs:
    tick: dora/timer/millis/10
    joint_cmd:
      source: budget-guard/joint_cmd_safe
      queue_size: 100
    gripper_cmd:
      source: budget-guard/gripper_cmd_safe
      queue_size: 100
    reset:
      source: reset/bridge_reset
      queue_size: 100
  outputs:
  - bridge_info
  - joint_state
  - gripper_state
  - oracle_state
  - rgb_overhead
  - rgb_wrist
  - depth_overhead
  - reset_done
- id: reset
  path: ../src/aisle/reset/service.py
  inputs:
    reset:
      source: rollout-client/reset
      queue_size: 100
    reset_done:
      source: dora-genesis/reset_done
      queue_size: 100
  outputs:
  - bridge_reset
  - reset_done
- id: budget-guard
  path: ../src/aisle/nodes/budget_guard.py
  inputs:
    tick: dora/timer/millis/5000
    joint_cmd:
      source: ik-trajectory/joint_cmd
      queue_size: 100
    gripper_cmd:
      source: ik-trajectory/gripper_cmd
      queue_size: 100
    reset_done:
      # the EPISODE boundary comes from the reset SERVICE, not the bridge
      # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
      # the bridge, so dora-genesis/reset_done never fires and every
      # episode-state consumer silently misses the boundary. The service
      # replies on every route -- teleport (it relays the bridge),
      # behavioral success, and behavioral exhaustion via fallback -- so it
      # is the single authority, and it is the same edge rollout-client
      # already waits on before starting the next episode.
      source: reset/reset_done
      queue_size: 100
  outputs:
  - joint_cmd_safe
  - gripper_cmd_safe
  - violation
  - guard_stats
- id: detected-pose
  path: ../src/aisle/nodes/l2_pose.py
  inputs:
    bridge_info:
      source: dora-genesis/bridge_info
      queue_size: 100
    rgb_overhead:
      source: dora-genesis/rgb_overhead
      queue_size: 100
    depth_overhead:
      source: dora-genesis/depth_overhead
      queue_size: 100
    target_request:
      source: task-state-machine/target_request
      queue_size: 100
    reset_done:
      # the EPISODE boundary comes from the reset SERVICE, not the bridge
      # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
      # the bridge, so dora-genesis/reset_done never fires and every
      # episode-state consumer silently misses the boundary. The service
      # replies on every route -- teleport (it relays the bridge),
      # behavioral success, and behavioral exhaustion via fallback -- so it
      # is the single authority, and it is the same edge rollout-client
      # already waits on before starting the next episode.
      source: reset/reset_done
      queue_size: 100
  outputs:
  - target_pose
- id: grasp-planner-topdown
  path: ../src/aisle/nodes/grasp_topdown.py
  inputs:
    target_pose:
      source: detected-pose/target_pose
      queue_size: 100
  outputs:
  - grasp_pose
- id: ik-trajectory
  path: ../src/aisle/nodes/ik_trajectory.py
  inputs:
    grasp_pose:
      source: grasp-planner-topdown/grasp_pose
      queue_size: 100
    joint_state:
      source: dora-genesis/joint_state
      queue_size: 1
    reset_done:
      # the EPISODE boundary comes from the reset SERVICE, not the bridge
      # (issue #192): a successful BEHAVIORAL reset (RST-2) never reaches
      # the bridge, so dora-genesis/reset_done never fires and every
      # episode-state consumer silently misses the boundary. The service
      # replies on every route -- teleport (it relays the bridge),
      # behavioral success, and behavioral exhaustion via fallback -- so it
      # is the single authority, and it is the same edge rollout-client
      # already waits on before starting the next episode.
      source: reset/reset_done
      queue_size: 100
  outputs:
  - joint_cmd
  - gripper_cmd
  - plan_done
- id: verifier-oracle
  path: ../src/aisle/verifier/oracle.py
  inputs:
    oracle_state:
      source: dora-genesis/oracle_state
      queue_size: 100
    joint_state:
      source: dora-genesis/joint_state
      queue_size: 100
    episode_goal:
      source: rollout-client/episode_goal
      queue_size: 100
  outputs:
  - episode_result
- id: task-state-machine
  path: ../src/aisle/nodes/task_state_machine.py
  inputs:
    tick: dora/timer/millis/1000
    episode_goal:
      source: rollout-client/episode_goal
      queue_size: 100
    episode_result:
      source: verifier-oracle/episode_result
      queue_size: 100
    violation:
      source: budget-guard/violation
      queue_size: 100
    plan_done:
      source: ik-trajectory/plan_done
      queue_size: 100
  outputs:
  - target_request
  - episode_feedback
  env:
    AISLE_MAX_RETRIES: '8'
- id: rollout-client
  path: ../src/aisle/harness/rollout_client.py
  inputs:
    tick: dora/timer/millis/1000
    reset_done:
      source: reset/reset_done
      queue_size: 100
    episode_result:
      source: verifier-oracle/episode_result
      queue_size: 100
    episode_feedback:
      source: task-state-machine/episode_feedback
      queue_size: 100
  outputs:
  - reset
  - episode_goal
