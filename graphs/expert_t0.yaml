# The hand-written T0 expert baseline (design doc §8.1.4; VAL-7 good
# corpus; A1 ablation baseline). Node ids ARE registry manifest ids —
# `harness validate` resolves each against registry/manifests/ (VAL-1/2),
# motion edges route through budget-guard (VAL-5), oracle_state feeds the
# verifier only (VAL-6); tier-T0 perception uses the non-privileged
# `poses` topic (SPEC 010, issue #2 resolution).
nodes:
  - id: dora-genesis
    path: ../src/aisle/nodes/dora_genesis.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_OUTPUTS: 'bridge_info,joint_state,gripper_state,oracle_state,poses,rgb_overhead,rgb_wrist,depth_overhead,reset_done,sim_turn'
    inputs:
      tick: dora/timer/millis/10
      joint_cmd:
        source: budget-guard/joint_cmd_safe
        queue_size: 100
      gripper_cmd:
        source: budget-guard/gripper_cmd_safe
        queue_size: 100
      reset:
        source: reset/bridge_reset
        queue_size: 100
      turn_commit:
        source: turn-barrier/turn_commit
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - bridge_info
      - joint_state
      - gripper_state
      - oracle_state
      - poses
      - rgb_overhead
      - rgb_wrist
      - depth_overhead
      - reset_done
      - sim_turn

  - id: reset
    path: ../src/aisle/reset/service.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'reset'
      AISLE_TURN_OUTPUTS: 'bridge_reset,reset_done,turn_done'
    inputs:
      reset:
        source: rollout-client/reset
        queue_size: 100
      reset_done:
        source: dora-genesis/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - bridge_reset
      - reset_done
      - turn_done

  - id: budget-guard
    path: ../src/aisle/nodes/budget_guard.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'budget-guard'
      AISLE_TURN_OUTPUTS: 'joint_cmd_safe,gripper_cmd_safe,violation,guard_stats,turn_done'
      AISLE_TURN_WALL_OUTPUTS: 'guard_stats'
    inputs:
      tick: dora/timer/millis/5000
      joint_cmd:
        source: ik-trajectory/joint_cmd
        queue_size: 100
      gripper_cmd:
        source: ik-trajectory/gripper_cmd
        queue_size: 100
      reset_done:
        source: dora-genesis/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - joint_cmd_safe
      - gripper_cmd_safe
      - violation
      - guard_stats
      - turn_done

  - id: oracle-pose
    path: ../src/aisle/nodes/oracle_pose.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'oracle-pose'
      AISLE_TURN_OUTPUTS: 'target_pose,turn_done'
    inputs:
      poses:
        source: dora-genesis/poses
        queue_size: 100
      target_request:
        source: task-state-machine/target_request
        queue_size: 100
      reset_done:
        source: dora-genesis/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - target_pose
      - turn_done

  - id: grasp-planner-topdown
    path: ../src/aisle/nodes/grasp_topdown.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'grasp-planner-topdown'
      AISLE_TURN_OUTPUTS: 'grasp_pose,turn_done'
    inputs:
      target_pose:
        source: oracle-pose/target_pose
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - grasp_pose
      - turn_done

  - id: ik-trajectory
    path: ../src/aisle/nodes/ik_trajectory.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'ik-trajectory'
      AISLE_TURN_OUTPUTS: 'joint_cmd,gripper_cmd,turn_done'
    inputs:
      grasp_pose:
        source: grasp-planner-topdown/grasp_pose
        queue_size: 100
      joint_state:
        source: dora-genesis/joint_state
        # latest-wins: joint_state is STATE, not a command stream. With a
        # deep queue the executor seeds its interpolation start from a
        # stale pre-reset frame after an episode ends mid-plan (the reset
        # fires on the verdict, not on plan completion) and the arm dives
        # from home toward the stale pose through the fresh scene —
        # confirmed in M0 run m0-1-e2e07b (episodes 12/13 cascade).
        queue_size: 1
      reset_done:
        source: dora-genesis/reset_done
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - joint_cmd
      - gripper_cmd
      - turn_done

  - id: verifier-oracle
    path: ../src/aisle/verifier/oracle.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'verifier-oracle'
      AISLE_TURN_OUTPUTS: 'episode_result,turn_done'
    inputs:
      oracle_state:
        source: dora-genesis/oracle_state
        queue_size: 100
      joint_state:
        source: dora-genesis/joint_state
        queue_size: 100
      episode_goal:
        source: rollout-client/episode_goal
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - episode_result
      - turn_done

  - id: task-state-machine
    path: ../src/aisle/nodes/task_state_machine.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'task-state-machine'
      AISLE_TURN_OUTPUTS: 'target_request,episode_feedback,turn_done'
    inputs:
      tick: dora/timer/millis/1000
      episode_goal:
        source: rollout-client/episode_goal
        queue_size: 100
      episode_result:
        source: verifier-oracle/episode_result
        queue_size: 100
      violation:
        source: budget-guard/violation
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - target_request
      - episode_feedback
      - turn_done

  - id: rollout-client
    path: ../src/aisle/harness/rollout_client.py
    env:
      AISLE_LOCKSTEP: '1'
      AISLE_TURN_NODE: 'rollout-client'
      AISLE_TURN_OUTPUTS: 'reset,episode_goal,turn_done'
    inputs:
      tick: dora/timer/millis/1000
      reset_done:
        source: reset/reset_done
        queue_size: 100
      episode_result:
        source: verifier-oracle/episode_result
        queue_size: 100
      turn:
        source: turn-barrier/turn
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - reset
      - episode_goal
      - turn_done
  - id: turn-barrier
    path: ../src/aisle/nodes/turn_barrier.py
    env:
      AISLE_TURN_PLAN: 'turn_plans/expert_t0.json'
      AISLE_TURN_WATCHDOG_S: '2'
      AISLE_VERDICT_TURN_WATCHDOG_S: '15'
    inputs:
      tick: dora/timer/millis/100
      sim_turn:
        source: dora-genesis/sim_turn
        queue_size: 4
        queue_policy: backpressure
      done_0:
        source: budget-guard/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_1:
        source: grasp-planner-topdown/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_2:
        source: ik-trajectory/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_3:
        source: oracle-pose/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_4:
        source: reset/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_5:
        source: rollout-client/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_6:
        source: task-state-machine/turn_done
        queue_size: 4
        queue_policy: backpressure
      done_7:
        source: verifier-oracle/turn_done
        queue_size: 4
        queue_policy: backpressure
    outputs:
      - turn
      - turn_commit
